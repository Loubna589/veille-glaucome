<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte des acteurs — Glaucoma Intelligence</title>
  <meta name="description" content="Cartographie interactive des essais cliniques du glaucome, de leurs traitements, promoteurs, financeurs et publications liées.">
  <link rel="canonical" href="https://loubna589.github.io/veille-glaucome/carte.html">
  <link rel="stylesheet" href="css/style.css?v=8d984dfc87">
  <style>
    .carte-zone { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
    #cy { height: 640px; background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); box-shadow: var(--ombre); }
    #fiche { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 14px 16px; box-shadow: var(--ombre); font-size: .9rem; align-self: start; }
    .legende { display: flex; flex-wrap: wrap; gap: 12px; font-size: .85rem; color: var(--doux); margin: 0 0 10px; }
    .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    @media (max-width: 860px) { .carte-zone { grid-template-columns: 1fr; } #cy { height: 480px; } }
  </style>
</head>
<body>
  <div id="nav"></div>
  <main class="page">
    <header class="hero">
      <h1>Carte des acteurs</h1>
      <p>Qui travaille sur quoi : chaque point est un essai, un traitement, un organisme ou un article, et chaque trait relie deux
        éléments qui sont liés dans une source officielle. <strong>Cliquez sur un point</strong> pour voir le détail.</p>
    </header>
    <form class="filtres" id="filtres" onsubmit="return false">
      <label class="case"><input type="checkbox" value="essai" checked> Essais</label>
      <label class="case"><input type="checkbox" value="traitement" checked> Traitements</label>
      <label class="case"><input type="checkbox" value="laboratoire" checked> Laboratoires</label>
      <label class="case"><input type="checkbox" value="academique" checked> Universités, hôpitaux, financeurs</label>
      <label class="case"><input type="checkbox" value="publication" checked> Publications</label>
      <label>Statut des essais<select id="f-statut"><option value="">tous</option></select></label>
      <label>Recherche<input type="search" id="f-texte" placeholder="netarsudil, Santen, NCT…"></label>
    </form>
    <div class="legende" id="legende"></div>
    <p class="compteur" id="compteur"></p>
    <div class="carte-zone">
      <div id="cy" role="img" aria-label="Graphe interactif des essais, traitements et organismes"></div>
      <aside id="fiche"><p class="vide">Cliquez sur un point de la carte pour voir le détail ici.</p></aside>
    </div>
  </main>
  <footer class="pied" id="pied"></footer>
  <script src="js/app.js?v=8e1722be0f"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script>
    Veille.pret(function () {
      var V = Veille;
      V.monterNavigation("carte");
      if (!window.cytoscape) { V.erreurChargement(new Error("Cytoscape.js n'a pas pu être chargé (connexion internet nécessaire)")); return; }
      var css = getComputedStyle(document.documentElement), c = function (v) { return css.getPropertyValue(v).trim(); };
      var COULEURS = { essai: c("--g1"), traitement: c("--g2"), laboratoire: c("--g5"), academique: c("--g4"), publication: c("--g3") };
      var NOMS = { essai: "Essai", traitement: "Traitement", laboratoire: "Laboratoire", academique: "Université, hôpital ou financeur", publication: "Publication" };
      var LIENS = { promoteur: "promoteur", collaborateur: "collaborateur", intervention: "intervention", financeur: "financeur", cite_essai: "cite l'essai",
                    titulaire: "laboratoire titulaire" };
      function famille(d) { return d.famille || d.type; }
      document.getElementById("legende").innerHTML = Object.keys(COULEURS).map(function (t) {
        return '<span><i style="background:' + COULEURS[t] + '"></i>' + NOMS[t] + "</span>";
      }).join("") + "<span>Taille = nombre de liens</span>";

      V.charger(["graphe.json"]).then(function (r) {
        var G = r[0];
        var statuts = {};
        G.noeuds.forEach(function (n) { if (n.statut) statuts[n.statut] = 1; });
        Object.keys(statuts).sort().forEach(function (s) { document.getElementById("f-statut").insertAdjacentHTML("beforeend", "<option>" + V.esc(s) + "</option>"); });

        var cy = cytoscape({
          container: document.getElementById("cy"),
          elements: G.noeuds.map(function (n) { return { data: Object.assign({}, n) }; })
            .concat(G.liens.map(function (l) { return { data: Object.assign({}, l) }; })),
          style: [
            { selector: "node", style: { "background-color": function (n) { return COULEURS[famille(n.data())]; },
              width: function (n) { return 10 + 4 * Math.min(n.data("degre"), 12); }, height: function (n) { return 10 + 4 * Math.min(n.data("degre"), 12); },
              label: function (n) { return n.data("degre") >= 3 || n.data("famille") === "laboratoire" ? (n.data("label") || "").slice(0, 28) : ""; },
              "font-size": 9, color: c("--texte"), "text-valign": "bottom", "text-margin-y": 3 } },
            { selector: "edge", style: { width: 1.2, "line-color": c("--bord"), "curve-style": "haystack", opacity: 0.8 } },
            { selector: "node:selected", style: { "border-width": 3, "border-color": c("--nouveau"), label: "data(label)" } },
            { selector: ".attenue", style: { opacity: 0.12 } },
          ],
          layout: { name: "cose", animate: false, nodeRepulsion: 6000, idealEdgeLength: 50, componentSpacing: 60 },
          wheelSensitivity: 0.3,
        });
        window.carte = cy;  // accessible depuis la console (démonstration, tests)

        function filtrer() {
          var types = [].slice.call(document.querySelectorAll("#filtres input[type=checkbox]:checked")).map(function (x) { return x.value; });
          var statut = document.getElementById("f-statut").value, texte = V.norm(document.getElementById("f-texte").value);
          cy.batch(function () {
            cy.nodes().forEach(function (n) {
              var d = n.data(), visible = types.indexOf(famille(d)) >= 0 && (!statut || d.type !== "essai" || d.statut === statut);
              n.style("display", visible ? "element" : "none");
            });
            // Un traitement ou un organisme dont tous les voisins sont masqués n'a plus de sens seul : on le masque aussi
            cy.nodes().forEach(function (n) {
              if (n.data("type") === "essai" || n.style("display") === "none") return;
              var voisinVisible = n.neighborhood("node").some(function (m) { return m.style("display") === "element"; });
              if (!voisinVisible) n.style("display", "none");
            });
            cy.nodes().removeClass("attenue");
            if (texte) {
              var trouves = cy.nodes().filter(function (n) { return V.norm(n.data("label") + " " + (n.data("titre") || "")).indexOf(texte) >= 0; });
              cy.elements().not(trouves.closedNeighborhood()).addClass("attenue");
            }
          });
          var visibles = cy.nodes().filter(function (n) { return n.style("display") === "element"; });
          document.getElementById("compteur").textContent = visibles.length + " point(s) affiché(s) sur " + G.statistiques.noeuds +
            " · " + G.statistiques.liens + " liens issus des sources";
        }
        document.getElementById("filtres").addEventListener("input", filtrer);
        filtrer();

        var buDe = {};
        (V.donnees.etudes || []).forEach(function (e) { if (e.lien_bu) buDe[e.id] = e.lien_bu; });
        function nom(n) {  // un article se lit par son titre, pas par son numéro PMID
          var t = n.data("titre");
          return n.data("type") === "publication" && t ? (t.length > 90 ? t.slice(0, 88) + "…" : t) : n.data("label");
        }
        cy.on("tap", "node", function (ev) {
          var d = ev.target.data(), pub = d.type === "publication" && d.titre;
          var bu = buDe[(d.id || "").replace(/^pmid:/, "")];
          var voisins = ev.target.connectedEdges().map(function (e) {
            var autre = e.source().id() === d.id ? e.target() : e.source();
            return "<li>" + V.esc(LIENS[e.data("type")] || e.data("type")) + " : <strong>" + V.esc(nom(autre)) + "</strong> <small>(" + V.esc(e.data("origine")) + ")</small></li>";
          }).join("");
          document.getElementById("fiche").innerHTML = '<span class="badge" style="background:' + COULEURS[famille(d)] + ';color:#fff">' + NOMS[famille(d)] + "</span>" +
            (pub ? "<h2 style=\"font-size:1.05rem;margin:8px 0\">" + V.esc(d.titre) + "</h2><p><small>" + V.esc(d.label) + "</small></p>"
              : "<h2 style=\"font-size:1.05rem;margin:8px 0\">" + V.esc(d.label) + "</h2>" + (d.titre ? "<p>" + V.esc(d.titre) + "</p>" : "")) +
            '<p class="meta" style="margin:6px 0">' + (d.statut ? "<span>Statut : " + V.esc(d.statut) + "</span>" : "") +
            (d.phase ? "<span>Phase : " + V.esc(d.phase) + "</span>" : "") + (d.categorie ? "<span>" + V.esc(d.categorie) + "</span>" : "") +
            (d.hors_base ? "<span>essai cité, hors base</span>" : "") + "</p>" +
            "<p><strong>" + ev.target.degree() + " lien(s)</strong></p><ul style=\"padding-left:1.1em;margin:4px 0 10px\">" + voisins + "</ul>" +
            '<div class="actions">' + (d.fiche ? '<a href="' + V.esc(d.fiche) + '">Fiche détaillée →</a>' : "") +
            (d.lien ? '<a href="' + V.esc(d.lien) + '" target="_blank" rel="noopener">Source ↗</a>' : "") +
            (bu ? '<a class="bouton-bu" href="' + V.esc(bu) + '" target="_blank" rel="noopener">📚 Demander à la BU</a>' : "") +
            (d.type === "organisme" ? '<a href="laboratoires.html?labo=' + encodeURIComponent(d.label) + '">Fiche du laboratoire →</a>' : "") + "</div>";
        });
      }).catch(V.erreurChargement);
    });
  </script>
</body>
</html>
