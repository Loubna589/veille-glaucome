<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="Inter, Segoe UI, system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Comment Glaucoma Intelligence se construit chaque jour</title>
<desc id="d">Sources officielles, robot GitHub Actions et tests, base SQLite, IA Gemini, contrôles qualité, site GitHub Pages ; sorties : alertes, e-mail de la semaine, fiches concurrents, accès aux articles, chiffres de marché.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52627a"/></marker>
<style>.h1{font-size:21px;font-weight:800;fill:#0f1d33}.h2{font-size:16px;font-weight:800;fill:#0f1d33}.sous{font-size:13px;fill:#52627a}.mini{font-size:11.5px;fill:#52627a}
.ttl{font-size:14.5px;font-weight:700;fill:#fff}.num{font-size:12px;font-weight:800;fill:#0f1d33}.txt{font-size:12.5px;fill:#33425a}.gras{font-size:12.5px;font-weight:700;fill:#0f1d33}
.fl{stroke:#52627a;stroke-width:2;fill:none;marker-end:url(#f)}</style></defs>
<rect width="1240" height="780" fill="#f4f7fb"/>
<text x="28" y="42" class="h1" text-anchor="start">Glaucoma Intelligence : comment le site se construit tout seul, chaque jour</text>
<text x="28" y="66" class="sous" text-anchor="start">Un robot (GitHub Actions) lance le programme Python ; si un test échoue, rien n'est publié et l'ancienne version du site reste en ligne.</text>
<rect x="28" y="92" width="250" height="372" rx="14" fill="#ffffff" stroke="#0b4f8a" stroke-width="2"/>
<rect x="28" y="92" width="250" height="38" rx="14" fill="#0b4f8a"/><rect x="28" y="116" width="250" height="14" fill="#0b4f8a"/>
<circle cx="48" cy="111" r="11" fill="#fff"/>
<text x="48" y="116" class="num" text-anchor="middle">1</text>
<text x="66" y="117" class="ttl" text-anchor="start">Les sources officielles</text>
<text x="42" y="152" class="txt" text-anchor="start">Le robot lit des sites publics</text>
<text x="42" y="171" class="txt" text-anchor="start">et gratuits.</text>
<text x="42" y="190" class="txt" text-anchor="start"></text>
<text x="42" y="209" class="txt" text-anchor="start">ClinicalTrials.gov donne les</text>
<text x="42" y="228" class="txt" text-anchor="start">essais cliniques en cours.</text>
<text x="42" y="247" class="txt" text-anchor="start"></text>
<text x="42" y="266" class="txt" text-anchor="start">PubMed et OpenAlex donnent</text>
<text x="42" y="285" class="txt" text-anchor="start">les articles scientifiques.</text>
<rect x="318" y="92" width="250" height="210" rx="14" fill="#ffffff" stroke="#0b7a73" stroke-width="2"/>
<rect x="318" y="92" width="250" height="38" rx="14" fill="#0b7a73"/><rect x="318" y="116" width="250" height="14" fill="#0b7a73"/>
<circle cx="338" cy="111" r="11" fill="#fff"/>
<text x="338" y="116" class="num" text-anchor="middle">2</text>
<text x="356" y="117" class="ttl" text-anchor="start">Le robot quotidien</text>
<text x="332" y="152" class="txt" text-anchor="start">Chaque matin, un programme</text>
<text x="332" y="171" class="txt" text-anchor="start">se lance tout seul chez GitHub.</text>
<text x="332" y="190" class="txt" text-anchor="start">Il vérifie d'abord que tout</text>
<text x="332" y="209" class="txt" text-anchor="start">marche (149 tests), puis il</text>
<text x="332" y="228" class="txt" text-anchor="start">va chercher les nouveautés.</text>
<rect x="318" y="334" width="250" height="130" rx="14" fill="#ffffff" stroke="#3f3c9e" stroke-width="2"/>
<rect x="318" y="334" width="250" height="38" rx="14" fill="#3f3c9e"/><rect x="318" y="358" width="250" height="14" fill="#3f3c9e"/>
<circle cx="338" cy="353" r="11" fill="#fff"/>
<text x="338" y="358" class="num" text-anchor="middle">3</text>
<text x="356" y="359" class="ttl" text-anchor="start">La base de données</text>
<text x="332" y="394" class="txt" text-anchor="start">Tout est rangé dans un seul</text>
<text x="332" y="413" class="txt" text-anchor="start">fichier, avec l'historique :</text>
<text x="332" y="432" class="txt" text-anchor="start">on voit ce qui a changé.</text>
<rect x="608" y="92" width="290" height="210" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
<rect x="608" y="92" width="290" height="38" rx="14" fill="#c2410c"/><rect x="608" y="116" width="290" height="14" fill="#c2410c"/>
<circle cx="628" cy="111" r="11" fill="#fff"/>
<text x="628" y="116" class="num" text-anchor="middle">4</text>
<text x="646" y="117" class="ttl" text-anchor="start">L'IA : Gemini (Google)</text>
<text x="622" y="152" class="txt" text-anchor="start">L'IA résume chaque article en</text>
<text x="622" y="171" class="txt" text-anchor="start">3 lignes de français et le range</text>
<text x="622" y="190" class="txt" text-anchor="start">dans une catégorie.</text>
<text x="622" y="209" class="txt" text-anchor="start">Elle écrit aussi les 5 points</text>
<text x="622" y="228" class="txt" text-anchor="start">de la semaine. Tout ce qu'elle</text>
<text x="622" y="247" class="txt" text-anchor="start">écrit est marqué « à vérifier ».</text>
<rect x="608" y="334" width="290" height="130" rx="14" fill="#ffffff" stroke="#8a5300" stroke-width="2"/>
<rect x="608" y="334" width="290" height="38" rx="14" fill="#8a5300"/><rect x="608" y="358" width="290" height="14" fill="#8a5300"/>
<circle cx="628" cy="353" r="11" fill="#fff"/>
<text x="628" y="358" class="num" text-anchor="middle">5</text>
<text x="646" y="359" class="ttl" text-anchor="start">Les contrôles qualité</text>
<text x="622" y="394" class="txt" text-anchor="start">Une fiche incomplète, en double</text>
<text x="622" y="413" class="txt" text-anchor="start">ou avec une date fausse</text>
<text x="622" y="432" class="txt" text-anchor="start">n'est pas publiée.</text>
<rect x="938" y="92" width="274" height="372" rx="14" fill="#ffffff" stroke="#146c43" stroke-width="2"/>
<rect x="938" y="92" width="274" height="38" rx="14" fill="#146c43"/><rect x="938" y="116" width="274" height="14" fill="#146c43"/>
<circle cx="958" cy="111" r="11" fill="#fff"/>
<text x="958" y="116" class="num" text-anchor="middle">6</text>
<text x="976" y="117" class="ttl" text-anchor="start">Le site (GitHub Pages)</text>
<text x="952" y="152" class="txt" text-anchor="start">Le site se met à jour tout seul,</text>
<text x="952" y="171" class="txt" text-anchor="start">gratuitement.</text>
<text x="952" y="190" class="txt" text-anchor="start"></text>
<text x="952" y="209" class="txt" text-anchor="start">On y lit les 5 points de la</text>
<text x="952" y="228" class="txt" text-anchor="start">semaine, et on cherche un essai</text>
<text x="952" y="247" class="txt" text-anchor="start">ou un article.</text>
<text x="952" y="266" class="txt" text-anchor="start"></text>
<text x="952" y="285" class="txt" text-anchor="start">Un assistant répond aux</text>
<text x="952" y="304" class="txt" text-anchor="start">questions en citant ses sources.</text>
<text x="952" y="323" class="txt" text-anchor="start"></text>
<text x="952" y="342" class="txt" text-anchor="start">Je reçois aussi un e-mail chaque</text>
<text x="952" y="361" class="txt" text-anchor="start">semaine et des alertes.</text>
<path d="M278,200 L314,200" class="fl"/>
<path d="M443,302 L443,330" class="fl"/>
<path d="M568,200 L604,200" class="fl"/>
<path d="M568,400 L604,400" class="fl"/>
<path d="M753,302 L753,330" class="fl"/>
<path d="M898,400 L934,400" class="fl"/>
<text x="28" y="510" class="h2" text-anchor="start">Ce qui en sort, sans intervention</text>
<rect x="28" y="526" width="226" height="128" rx="14" fill="#ffffff" stroke="#0b4f8a" stroke-width="2"/>
<rect x="28" y="526" width="226" height="38" rx="14" fill="#0b4f8a"/><rect x="28" y="550" width="226" height="14" fill="#0b4f8a"/>
<text x="42" y="551" class="ttl" text-anchor="start">Alertes</text>
<text x="42" y="586" class="txt" text-anchor="start">nouvel essai, changement de</text>
<text x="42" y="605" class="txt" text-anchor="start">statut, de date, résultats :</text>
<text x="42" y="624" class="txt" text-anchor="start">jamais signalé deux fois</text>
<rect x="268" y="526" width="226" height="128" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
<rect x="268" y="526" width="226" height="38" rx="14" fill="#c2410c"/><rect x="268" y="550" width="226" height="14" fill="#c2410c"/>
<text x="282" y="551" class="ttl" text-anchor="start">E-mail de la semaine</text>
<text x="282" y="586" class="txt" text-anchor="start">les 5 points + les alertes,</text>
<text x="282" y="605" class="txt" text-anchor="start">tous les 7 jours, par Gmail</text>
<text x="282" y="624" class="txt" text-anchor="start">et par une issue GitHub</text>
<rect x="508" y="526" width="226" height="128" rx="14" fill="#ffffff" stroke="#146c43" stroke-width="2"/>
<rect x="508" y="526" width="226" height="38" rx="14" fill="#146c43"/><rect x="508" y="550" width="226" height="14" fill="#146c43"/>
<text x="522" y="551" class="ttl" text-anchor="start">Filtres</text>
<text x="522" y="586" class="txt" text-anchor="start">par classe de traitement</text>
<text x="522" y="605" class="txt" text-anchor="start">(prostaglandines, bêta-</text>
<text x="522" y="624" class="txt" text-anchor="start">bloquants…) et type d'étude</text>
<rect x="748" y="526" width="226" height="128" rx="14" fill="#ffffff" stroke="#3f3c9e" stroke-width="2"/>
<rect x="748" y="526" width="226" height="38" rx="14" fill="#3f3c9e"/><rect x="748" y="550" width="226" height="14" fill="#3f3c9e"/>
<text x="762" y="551" class="ttl" text-anchor="start">Accès aux articles</text>
<text x="762" y="586" class="txt" text-anchor="start">libre ou payant ; boutons :</text>
<text x="762" y="605" class="txt" text-anchor="start">texte gratuit, auteur,</text>
<text x="762" y="624" class="txt" text-anchor="start">ResearchGate, BU</text>
<rect x="988" y="526" width="226" height="128" rx="14" fill="#ffffff" stroke="#0b7a73" stroke-width="2"/>
<rect x="988" y="526" width="226" height="38" rx="14" fill="#0b7a73"/><rect x="988" y="550" width="226" height="14" fill="#0b7a73"/>
<text x="1002" y="551" class="ttl" text-anchor="start">Rétractations</text>
<text x="1002" y="586" class="txt" text-anchor="start">bandeau rouge si une revue</text>
<text x="1002" y="605" class="txt" text-anchor="start">retire un article ; orange</text>
<text x="1002" y="624" class="txt" text-anchor="start">si une correction paraît</text>
<text x="28" y="690" class="sous" text-anchor="start">Recherche « par le sens » : un petit modèle, sur la machine, transforme chaque texte en empreinte de sens ;</text>
<text x="28" y="710" class="sous" text-anchor="start">une question en français retrouve un article en anglais qui parle de la même chose. L'assistant ne répond qu'avec les articles trouvés, et les cite.</text>
<text x="28" y="742" class="mini" text-anchor="start">Code ouvert : github.com/Loubna589/veille-glaucome · projet pédagogique, M2 MOD, IAE Clermont Auvergne</text>
</svg>