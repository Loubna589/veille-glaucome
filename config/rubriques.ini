# =====================================================================
# Classement AUTOMATIQUE des études en rubriques — fichier modifiable
# =====================================================================
# Chaque fiche affiche sa rubrique ET la règle qui l'a produite, avec la mention
# « classement automatique ». Une étude peut entrer dans plusieurs rubriques ;
# la rubrique principale est la première dans l'ordre de priorité ci-dessous.
#
# Pour chaque rubrique :
#   types_registre : types d'intervention DÉCLARÉS au registre ClinicalTrials.gov
#                    (pour un essai, on regarde les interventions des bras expérimentaux)
#   buts_registre  : but principal déclaré au registre (TREATMENT, DIAGNOSTIC, SCREENING…)
#   termes_titre   : mots cherchés dans le TITRE d'un article (* = toute terminaison)
#   etiquettes     : étiquettes calculées par l'outil qui suffisent à classer
# Les études vétérinaires sont TOUJOURS placées à part, dans la rubrique « veterinaire ».
# =====================================================================

[ordre]
priorite = medicaments, dispositifs_chirurgie, diagnostic_ia, recherche_fondamentale

[medicaments]
nom = Médicaments
types_registre = DRUG, BIOLOGICAL, COMBINATION_PRODUCT
