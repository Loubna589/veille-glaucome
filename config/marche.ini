# =====================================================================
# Accès au marché — molécules suivies (fichier modifiable)
# =====================================================================
# Une ligne par molécule ou association :
#     Nom affiché = substance 1 + substance 2
# Les substances s'écrivent en DCI, sans accent ni sel : « timolol » et non
# « maléate de timolol ». Les sels (maléate, chlorhydrate, tartrate, mésilate…)
# sont retirés automatiquement des noms trouvés dans les sources.
#
# Règle de rapprochement : un médicament est rattaché à une ligne si ses
# substances actives sont EXACTEMENT celles de la ligne. Le timolol seul et
# l'association dorzolamide + timolol sont donc deux lignes différentes.
# Seuls les médicaments à usage ophtalmique sont retenus.
#
# Pour suivre une association de plus, ajoutez simplement une ligne, par ex. :
#     Latanoprost + timolol = latanoprost + timolol
# =====================================================================

[molecules]
Latanoprost = latanoprost
Bimatoprost = bimatoprost
Travoprost = travoprost
Tafluprost = tafluprost
Timolol = timolol
Dorzolamide = dorzolamide
Brinzolamide = brinzolamide
Brimonidine = brimonidine
Netarsudil = netarsudil
Netarsudil + latanoprost (Roclanda / Rocklatan) = netarsudil + latanoprost
Latanoprostène bunod = latanoprostene bunod
Omidenepag = omidenepag
