# =====================================================================
# Regroupement des noms de laboratoires — fichier modifiable
# =====================================================================
# Le site regroupe AUTOMATIQUEMENT les variantes d'un même nom en retirant les
# suffixes juridiques et le pays entre parenthèses, par exemple :
#   « Santen Pharmaceutical Co., Ltd. » et « Santen (Japan) » → « Santen »
#
# Pour regrouper des noms que la règle automatique ne rapproche pas, ajoutez une
# ligne dans la rubrique [alias] :
#   Nom affiché = variante 1 | variante 2 | variante 3
#
# Attention : ne regroupez que des noms qui désignent vraiment le même organisme.
# Un rachat ou une filiale n'est PAS un alias : ce serait une interprétation.
# =====================================================================

[alias]
# Exemple (à décommenter si besoin) :
# Alcon = Alcon Research | Alcon Laboratories
# Même organisme, nom mieux écrit (accent) ou mention « MA EEIG » (titulaire européen de Pfizer) :
Théa = Thea | Laboratoires Thea
Pfizer = Pfizer Europe MA EEIG
