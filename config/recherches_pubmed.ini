# =====================================================================
# Recherches PubMed de la veille glaucome — fichier modifiable
# =====================================================================
# Règles d'écriture :
#   - une expression PubMed par ligne, avec son étiquette de champ :
#       [Mesh] = indexation officielle PubMed (vocabulaire contrôlé MeSH)
#       [tiab] = mot présent dans le titre ou le résumé
#   - les lignes d'une même rubrique sont reliées par OR ;
#   - un astérisque (*) cherche toutes les terminaisons (glaucom* → glaucoma, glaucomatous…) ;
#   - une ligne commençant par # est un commentaire (ignorée).
# Astuce : chaque ligne peut être testée telle quelle sur https://pubmed.ncbi.nlm.nih.gov
# =====================================================================


[large]
# RECHERCHE 1 — LARGE : tout le glaucome et l'hypertension oculaire.
# C'est elle qui COLLECTE : tout nouveau traitement, dispositif ou technique
# publié sur le sujet y entre, même s'il n'est dans aucune liste ci-dessous.
indexation =
    "Glaucoma"[Mesh]
    "Ocular Hypertension"[Mesh]
    "Glaucoma Drainage Implants"[Mesh]
    "Trabeculectomy"[Mesh]
texte =
    glaucom*[tiab]
    "ocular hypertension"[tiab]
    "ocular hypertensive"[tiab]
    "intraocular hypertension"[tiab]
    "minimally invasive glaucoma surgery"[tiab]
# Exclusions (reliées par NOT). Les livres et chapitres (ex. manuel StatPearls)
# sont redatés à chaque mise à jour et ne sont pas des publications de recherche.
exclusions =
    booksdocs[filter]


[ciblee]
# RECHERCHE 2 — CIBLÉE : produits suivis de près (molécules et noms commerciaux).
# Elle est TOUJOURS combinée à la recherche large (AND). Elle ne sert qu'à
# ÉTIQUETER les articles qui parlent d'un produit suivi : elle n'exclut rien.
# Une formulation ou une voie d'administration seule ne rend PAS un article « ciblé »
# (voir la rubrique [etiquettes] plus bas).

# Molécules (DCI), y compris classes thérapeutiques
molecules =
    bimatoprost[tiab]
    latanoprost[tiab]
    travoprost[tiab]
    tafluprost[tiab]
    "latanoprostene bunod"[tiab]
    timolol[tiab]
    betaxolol[tiab]
    carteolol[tiab]
    levobunolol[tiab]
    dorzolamide[tiab]
    brinzolamide[tiab]
    acetazolamide[tiab]
    brimonidine[tiab]
    apraclonidine[tiab]
    netarsudil[tiab]
    ripasudil[tiab]
    pilocarpine[tiab]
    omidenepag[tiab]
    "rho kinase inhibitor*"[tiab]
    "rho-kinase inhibitor*"[tiab]
    "ROCK inhibitor*"[tiab]
    "rho-Associated Kinases"[Mesh]

# Noms commerciaux (ajout proposé : les articles citent parfois la marque seule)
marques =
    Xalatan[tiab]
    Lumigan[tiab]
    Travatan[tiab]
    Vyzulta[tiab]
    Rhopressa[tiab]
    Rocklatan[tiab]
    Roclanda[tiab]
    Glanatec[tiab]
    Eybelis[tiab]
    Omlonti[tiab]
    Durysta[tiab]
    iDose[tiab]
    Cosopt[tiab]
    Combigan[tiab]
    Simbrinza[tiab]
    Ganfort[tiab]
    Xalacom[tiab]
    DuoTrav[tiab]
    Azarga[tiab]
    Saflutan[tiab]
    Zioptan[tiab]

# Associations fixes à reconnaître : un article est signalé « molécules citées
# ensemble » s'il cite les DEUX molécules (cela ne prouve pas qu'il s'agit
# du produit en association fixe).
# Format : molécule + molécule
associations_fixes =
    bimatoprost + timolol
    latanoprost + timolol
    travoprost + timolol
    dorzolamide + timolol
    brinzolamide + timolol
    brimonidine + timolol
    brinzolamide + brimonidine
    netarsudil + latanoprost


[etiquettes]
# ÉTIQUETTES : informations calculées sur chaque article, affichées à part.
# Elles n'ajoutent ni ne retirent aucun article de la collecte.

# Nouvelles formulations et voies d'administration (étiquette distincte des molécules)
formulations =
    "sustained release"[tiab]
    "sustained-release"[tiab]
    "extended release"[tiab]
    "drug delivery"[tiab]
    "Drug Implants"[Mesh]
    "Delayed-Action Preparations"[Mesh]
    intracameral[tiab]
    "punctal plug*"[tiab]
    "drug-eluting"[tiab]
    "ocular insert*"[tiab]
    "preservative-free"[tiab]
    nanoparticle*[tiab]
    nanoemulsion*[tiab]
    liposom*[tiab]
    microsphere*[tiab]
    "contact lens*"[tiab]
    subconjunctival[tiab]
    suprachoroidal[tiab]

# Suffixes officiels de DCI (dénominations communes internationales, système OMS)
# des classes antiglaucomateuses. Un mot du TITRE se terminant ainsi et absent de
# la liste des molécules est signalé « molécule hors liste, à vérifier »
# (ex. sepetaprost). C'est un repérage automatique, pas une affirmation.
suffixes_dci =
    prost
    olol
    zolamide
    onidine
    sudil
    carpine
    nepag

# Stade « préclinique » : d'après l'indexation MeSH de PubMed uniquement.
# Un article encore non indexé (fréquent les premières semaines) reste « non renseigné ».
preclinique_mesh_si_present =
    Disease Models, Animal
preclinique_animaux_sans_humains = oui

# Études VÉTÉRINAIRES (animaux soignés) : classées HORS de la veille principale
# (conservées et consultables, mais à part). Repérées par la revue ou l'indexation MeSH.
veterinaire_revues =
    Veterinary ophthalmology
    Veterinary record
    Journal of the American Veterinary Medical Association
    Journal of small animal practice
    Frontiers in veterinary science
    The Veterinary clinics of North America. Small animal practice
    Journal of veterinary internal medicine
    Veterinary sciences
veterinaire_mesh =
    Dog Diseases
    Cat Diseases
    Horse Diseases
    Cattle Diseases
    Animal Diseases
