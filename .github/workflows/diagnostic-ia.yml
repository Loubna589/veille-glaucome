# Temporaire : vérifier la réponse de GitHub Models depuis Actions (sera supprimé).
name: Diagnostic IA
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Appel curl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","max_tokens":20,"messages":[{"role":"user","content":"Dis bonjour"}]}' | head -c 1500
          echo; echo ----- python
          pip install -q requests
          python - <<'PY'
          import os, requests
          r = requests.post("https://models.github.ai/inference/chat/completions",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "User-Agent": "test"},
              json={"model": "openai/gpt-4o-mini", "max_tokens": 20, "messages": [{"role": "user", "content": "Dis bonjour"}]}, timeout=60)
          print(r.status_code, r.headers.get("Content-Type"), r.url, [h.status_code for h in r.history], r.text[:300])
          PY
