# Temporaire : mesurer les scores de la recherche pour des questions hors sujet (sera supprimé).
name: Diagnostic IA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: data/local/modeles
          key: modele-multilingual-e5-small-q8
      - name: Scores
        run: |
          python - <<'PY'
          from veille import semantique, base
          semantique.construire_index(base.connecter())
          enc = semantique.Encodeur(); idx = semantique.Index.charger()
          qs = ["QUI EST PRO DOC", "Quelle est la capitale de la France ?", "recette de la tarte aux pommes", "météo demain",
                "qui est le président", "bonjour", "combien coûte un iPhone", "Quels essais étudient le netarsudil ?",
                "Quels traitements du glaucome sans conservateur font l'objet de recherches cliniques ?", "nouveaux collyres",
                "Que fait Théa ?", "chirurgie MIGS résultats", "dépistage par intelligence artificielle",
                "quels sont les effets secondaires du timolol", "pression oculaire et sommeil", "qui finance la recherche sur la cataracte",
                "Que dit la recherche sur l'intelligence artificielle pour dépister le glaucome ?"]
          for q in qs:
              r, e = semantique.rechercher(idx, enc, q, k=3)
              print(f"{r[0]['score']:.3f} {r[2]['score']:.3f} | {q} | {r[0].get('titre','')[:60]}")
          PY
