name: verif-en-ligne
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://loubna589.github.io/veille-glaucome
          curl -s "$B/comparer.html?x=$RANDOM" | grep -o 'refresh[^>]*' || echo PAS_DE_REDIRECTION
          echo "comparer dans menu: $(curl -s "$B/js/app.js?x=$RANDOM" | grep -c 'id: "comparer"')"
          curl -s "$B/img/architecture.svg?x=$RANDOM" | grep -o 'Filtres\|on compare\|La base officielle' | sort -u
