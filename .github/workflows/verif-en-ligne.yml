name: verif-en-ligne
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://loubna589.github.io/veille-glaucome
          curl -s "$B/img/architecture.svg?x=$RANDOM" | grep -o 'Gemini a 3 rôles\|Cloudflare, qui cache' | sort -u
          curl -s "$B/fonctionnement.html?x=$RANDOM" | grep -o 'architecture.svg?v=4'
