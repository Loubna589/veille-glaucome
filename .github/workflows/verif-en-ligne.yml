name: Vérification du site en ligne (temporaire)
on: workflow_dispatch
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir les pages en ligne dans un vrai navigateur
        run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > v.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();
          for (const u of ['', 'index.html', 'apropos.html', 'semaine.html', 'etudes.html', 'laboratoires.html', 'marche.html', 'fonctionnement.html', 'methode.html']){
            const p=await b.newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push('console: '+m.text())});
            await p.goto('https://loubna589.github.io/veille-glaucome/'+u+'?t='+Date.now(),{waitUntil:'networkidle'});await p.waitForTimeout(2500);
            const r=await p.evaluate(()=>({nav:document.querySelectorAll('.nav__liens a').length,actions:document.querySelectorAll('#actions .action').length,
              chiffres:(document.getElementById('chiffres')||{}).innerHTML?.length||0,canvas:document.querySelectorAll('canvas').length,fil:!!document.getElementById('fil-etapes')}));
            console.log('PAGE', u||'(racine)', JSON.stringify(r), errs.length? 'ERREURS: '+errs.join(' | '):'sans erreur');}
          await b.close();})();
          JS
          node v.js
