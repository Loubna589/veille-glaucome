name: Vérification de l'assistant en ligne (temporaire)
on: workflow_dispatch
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Appel direct du service
        run: |
          curl -sS -X POST "https://glaucoma-assistant.loubna-benmahmoud-190.workers.dev" -H "Origin: https://loubna589.github.io" \
            -H "Content-Type: application/json" -d '{"question":"Quel est l arbre decisionnel de prise en charge du glaucome ?","documents":[]}' | head -c 1500; echo
      - name: Question posée depuis le site, dans un vrai navigateur
        run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > v.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();
          p.on('pageerror',e=>console.log('ERREUR',e.message));
          await p.goto('https://loubna589.github.io/veille-glaucome/semaine.html?t='+Date.now(),{waitUntil:'networkidle'});await p.waitForTimeout(2000);
          await p.click('#gi-bulle');await p.fill('#gi-q',"Quel est l'arbre décisionnel de prise en charge du glaucome ?");await p.press('#gi-q','Enter');
          await p.waitForTimeout(45000);
          console.log('REPONSE', (await p.$$eval('.gi-msg--ia',x=>x[x.length-1].innerText)).slice(0,2500));await b.close();})();
          JS
          node v.js
