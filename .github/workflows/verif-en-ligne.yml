name: verif-en-ligne
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://loubna589.github.io/veille-glaucome
          curl -s "$B/img/architecture.svg?x=$RANDOM" | grep -o 'rect x="608" y="[0-9]*"' | sort -u
          curl -s "$B/fonctionnement.html?x=$RANDOM" | grep -o 'de la case 1 à la case 6'
