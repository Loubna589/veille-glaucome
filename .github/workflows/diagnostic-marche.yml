# Temporaire : premier remplissage des chiffres de marché publics (sera supprimé).
name: Diagnostic marche
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collecter_chiffres_marche.py
      - run: |
          git config user.name "veille-automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historique/chiffres_marche.json
          git commit -m "Chiffres de marché publics : premier remplissage"
          git pull --rebase && git push
