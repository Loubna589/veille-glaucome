# Temporaire : repérer les fichiers Open Medic et Medicare Part D (sera supprimé).
name: Diagnostic marche
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Explorer
        run: |
          pip install -q openpyxl
          python3 - <<'PY'
          import csv, io, re, urllib.request, zipfile, collections
          B = "https://open-data-assurance-maladie.ameli.fr/medicaments/"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 veille-glaucome"}), timeout=600)
              return r.read()
          try:
              h = get("https://www.assurance-maladie.ameli.fr/content/descriptif-des-variables-de-la-serie-open-medic")
              print("DESC", h[:4], len(h))
              if h[:2] == b"PK":
                  import openpyxl
                  wb = openpyxl.load_workbook(io.BytesIO(h), read_only=True)
                  for ws in wb.worksheets:
                      print("FEUILLE", ws.title)
                      for row in ws.iter_rows(values_only=True):
                          t = " | ".join(str(c) for c in row if c is not None)
                          if t and re.search(r"TOP_GEN|GEN_NUM|PSP_SPE|g[ée]n[ée]ri|princeps|^\s*(0|1|2|3|4|15|90|98|99)\b", t, re.I): print("  ", t[:250])
              else:
                  print(re.findall(r'href="([^"]+\.xlsx?[^"]*)"', h.decode("utf-8", "replace"))[:10])
          except Exception as e: print("desc", repr(e))
          page = get(B + "download.php?Dir_Rep=Open_MEDIC_Base_Complete&Annee=2025").decode("utf-8", "replace")
          lien = re.findall(r'href="\./(download_file\.php\?[^"]+)"', page)[0].replace("&amp;", "&")
          z = zipfile.ZipFile(io.BytesIO(get(B + lien)))
          c = collections.Counter()
          with z.open(z.namelist()[0]) as f:
              r = csv.reader(io.TextIOWrapper(f, "latin-1"), delimiter=";"); ent = next(r)
              for l in r:
                  if l[4] == "S01E": c[(l[8], l[12], l[11])] += float(l[18].replace(",", ".") or 0)
          vus = collections.Counter()
          for (a, g, lib), v in c.most_common():
              if a in ("S01EE01", "S01EE03", "S01EC04", "S01ED51", "S01EA05") and vus[(a, g)] < 4:
                  vus[(a, g)] += 1; print(a, "TOP_GEN", g, lib, int(v))
          PY
