# Temporaire : repérer les fichiers Open Medic et Medicare Part D (sera supprimé).
name: Diagnostic marche
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Explorer
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          def get(u, n=None):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "veille-glaucome"}), timeout=60)
              return r.read(n) if n else r.read()
          try:
              d = json.loads(get("https://www.data.gouv.fr/api/1/datasets/?q=open%20medic&page_size=5"))
              for ds in d["data"]:
                  print("DS", ds["id"], ds["title"], ds.get("organization", {}).get("name"))
                  for r in ds["resources"][:40]:
                      print("   ", r["title"], r.get("format"), r.get("filesize"), r["url"])
          except Exception as e: print("datagouv", e)
          try:
              h = get("https://open-data-assurance-maladie.ameli.fr/medicaments/index.php").decode("utf-8", "replace")
              print("AMELI", sorted(set(re.findall(r'href="([^"]+)"', h)))[:80])
          except Exception as e: print("ameli", e)
          try:
              cat = json.loads(get("https://data.cms.gov/data.json"))
              for ds in cat["dataset"]:
                  if "Part D Spending by Drug" in ds["title"]:
                      print("CMS", ds["title"], ds.get("modified"))
                      for x in ds["distribution"][:6]:
                          print("   ", x.get("title"), x.get("format"), x.get("accessURL") or x.get("downloadURL"))
          except Exception as e: print("cms", e)
          PY
