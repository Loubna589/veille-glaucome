# Temporaire : repérer les fichiers Open Medic et Medicare Part D (sera supprimé).
name: Diagnostic marche
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Explorer
        run: |
          python3 - <<'PY'
          import csv, io, re, time, urllib.request, zipfile, collections
          B = "https://open-data-assurance-maladie.ameli.fr/medicaments/"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "veille-glaucome"}), timeout=600)
              return r.read()
          t0 = time.time()
          page = get(B + "download.php?Dir_Rep=Open_MEDIC_Base_Complete&Annee=2025").decode("utf-8", "replace")
          lien = re.findall(r'href="\./(download_file\.php\?[^"]+)"', page)[0].replace("&amp;", "&")
          b = get(B + lien); print("zip", len(b), round(time.time() - t0), "s")
          z = zipfile.ZipFile(io.BytesIO(b))
          for n in z.namelist():
              print("FICHIER", n, z.getinfo(n).file_size)
              with z.open(n) as f:
                  r = csv.reader(io.TextIOWrapper(f, "latin-1"), delimiter=";")
                  ent = next(r); print("ENTETE", ent)
                  agg = collections.Counter(); ex = []; spe = collections.Counter(); gen = collections.Counter()
                  for l in r:
                      d = dict(zip(ent, l))
                      if d.get("ATC4", "").startswith("S01E") or d.get("ATC3", "") == "S01E":
                          if len(ex) < 5: ex.append(l)
                          bo = float(d["BOITES"].replace(",", ".") or 0)
                          agg[(d.get("ATC5"), d.get("L_ATC5"))] += bo; spe[d.get("PSP_SPE")] += bo; gen[(d.get("ATC5"), d.get("TOP_GEN"), d.get("GEN_NUM", "")[:1])] += bo
              for e in ex: print("EX", e)
              for k, v in agg.most_common(): print("ATC5", k, int(v))
              for k, v in spe.most_common(10): print("SPE", k, int(v))
              for k, v in sorted(gen.items())[:40]: print("GEN", k, int(v))
          print("fini", round(time.time() - t0), "s")
          # CMS : tout le fichier, lignes Overall des substances suivies
          t = get("https://data.cms.gov/sites/default/files/2026-06/98218f98-166c-4723-8438-c344a4ef96a6/DSD_PTD_RY26_P04_V10_DY24_BGM.csv").decode("utf-8", "replace")
          rows = list(csv.DictReader(io.StringIO(t))); print("CMS", len(rows), list(rows[0])[:8])
          motif = re.compile(r"latanoprost|bimatoprost|travoprost|tafluprost|timolol|dorzolamide|brinzolamide|brimonidine|netarsudil|omidenepag|apraclonidine|pilocarpine|betaxolol|carteolol|levobunolol", re.I)
          for x in rows:
              if x["Mftr_Name"] == "Overall" and motif.search(x["Gnrc_Name"]):
                  print(" ", x["Brnd_Name"], "|", x["Gnrc_Name"], "|", x["Tot_Mftr"], "|", x.get("Tot_Spndng_2024"), x.get("Tot_Clms_2024"))
          PY
