# Temporaire : repérer les fichiers Open Medic et Medicare Part D (sera supprimé).
name: Diagnostic marche
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Explorer
        run: |
          python3 - <<'PY'
          import urllib.request
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "veille-glaucome"}), timeout=180)
              return r.read()
          for u in ["https://open-data-assurance-maladie.ameli.fr/medicaments/download2.php?Dir_Rep=2025_CIP13",
                    "https://open-data-assurance-maladie.ameli.fr/medicaments/download.php?Dir_Rep=Open_MEDIC_Base_Complete&Annee=2025"]:
              print("=====", u); print(get(u).decode("utf-8", "replace"))
          PY
